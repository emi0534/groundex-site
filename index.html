    letter-spacing:0.01em;
    font-weight:600;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  .stripe{
    height:10px;
    background:repeating-linear-gradient(45deg,var(--yellow) 0 18px, var(--asphalt) 18px 36px);
    background-size:51px 51px;
    animation:stripe-move 2.4s linear infinite;
  }
  .stripe.thin{height:6px;}
  @keyframes stripe-move{
    0%{background-position:0 0;}
    100%{background-position:51px 0;}
  }
  @media (prefers-reduced-motion: reduce){
    .stripe{animation:none;}
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* SCROLL REVEAL */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.in-view{opacity:1;transform:translateY(0);}

  /* NAV */
  header{position:sticky;top:0;z-index:50;background:var(--asphalt);border-bottom:1px solid var(--line);}
  .navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1180px;margin:0 auto;gap:16px;}
  .logo{display:flex;align-items:center;gap:2px;font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--concrete);letter-spacing:0.02em;flex-shrink:0;
    background:var(--concrete);padding:8px 14px;border-radius:6px;}
  .logo img{height:34px;width:auto;display:block;}
  .tagline-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(242,183,5,0.12);border:1px solid rgba(242,183,5,0.4);color:var(--yellow);padding:8px 16px;border-radius:2px;font-size:13px;font-weight:600;letter-spacing:0.02em;margin-top:26px;}
  .tagline-badge svg{width:15px;height:15px;flex-shrink:0;}
  .logo span.box{background:var(--orange);color:var(--asphalt);padding:2px 8px;margin-left:2px;}
  nav.links{display:flex;gap:28px;}
  nav.links a{color:var(--concrete-2);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;transition:color .15s;}
  nav.links a:hover{color:var(--yellow);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .lang-btn{background:transparent;border:none;color:var(--concrete-2);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:7px 10px;cursor:pointer;letter-spacing:0.04em;transition:.15s;}
  .lang-btn.active{background:var(--orange);color:#fff;}
  .lang-btn:not(.active):hover{color:var(--yellow);}
  .wa-btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;padding:10px 18px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.03em;border-radius:2px;transition:background .15s, transform .15s;border:none;cursor:pointer;white-space:nowrap;}
  .wa-btn:hover{background:var(--orange-dark);transform:translateY(-1px);}
  .menu-toggle{display:none;background:none;border:none;color:var(--concrete);font-size:24px;cursor:pointer;}

  /* FLOATING WHATSAPP BUTTON */
  .wa-float{
    position:fixed;bottom:24px;right:24px;z-index:100;
    display:flex;align-items:center;gap:10px;
    background:#25D366;color:#fff;
    padding:14px 20px;border-radius:50px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    font-weight:700;font-size:14px;letter-spacing:0.02em;
    text-transform:uppercase;
    transition:transform .15s, box-shadow .15s;
  }
  .wa-float:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(0,0,0,0.4);}
  .wa-float svg{width:22px;height:22px;flex-shrink:0;}
  .wa-float .pulse{
    position:absolute;inset:0;border-radius:50px;
    box-shadow:0 0 0 0 rgba(37,211,102,0.55);
    animation:wa-pulse 2.2s infinite;
    pointer-events:none;
  }
  @keyframes wa-pulse{
    0%{box-shadow:0 0 0 0 rgba(37,211,102,0.55);}
    70%{box-shadow:0 0 0 16px rgba(37,211,102,0);}
    100%{box-shadow:0 0 0 0 rgba(37,211,102,0);}
  }
  @media (max-width:560px){
    .wa-float{bottom:16px;right:16px;padding:13px 16px;}
    .wa-float span.wa-float-label{display:none;}
  }


  /* HERO */
  .hero{background:linear-gradient(180deg,var(--asphalt) 0%, var(--asphalt-2) 100%);color:var(--concrete);padding:90px 24px 70px;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;right:-10%;top:-20%;width:600px;height:600px;background:radial-gradient(circle, rgba(232,89,12,0.16) 0%, transparent 70%);}
  .hero-inner{max-width:1180px;margin:0 auto;position:relative;}

  /* IŞIK HUZMESİ — sahneye derinlik katan yavaş geçen ışık */
  .light-sweep{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  }
  .light-sweep::before{
    content:"";position:absolute;top:-20%;left:-30%;width:60%;height:140%;
    background:linear-gradient(75deg, transparent 0%, rgba(242,183,5,0.05) 35%, rgba(242,183,5,0.09) 50%, rgba(242,183,5,0.05) 65%, transparent 100%);
    transform:rotate(8deg);
    animation:sweep 9s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{left:-40%;}
    50%{left:70%;}
  }

  /* SİNEMATİK METİN GİRİŞİ — sayfa yüklenince kademeli beliren başlık/metin/butonlar */
  .cinema-in{
    opacity:0;transform:translateY(28px);
    animation:cinema-reveal 0.9s cubic-bezier(.16,.84,.44,1) forwards;
  }
  .cinema-in.d1{animation-delay:.05s;}
  .cinema-in.d2{animation-delay:.18s;}
  .cinema-in.d3{animation-delay:.34s;}
  .cinema-in.d4{animation-delay:.48s;}
  .cinema-in.d5{animation-delay:.62s;}
  @keyframes cinema-reveal{
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .cinema-in{animation:none;opacity:1;transform:none;}
    .light-sweep::before{animation:none;display:none;}
  }

  /* TOZ / DUMAN BULUTLARI */
  .dust-field{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .dust-mote{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(242,183,5,0.16) 0%, rgba(242,183,5,0.05) 45%, transparent 72%);
    filter:blur(3px);
    animation:dust-drift linear infinite;
    will-change:transform,opacity;
  }
  @keyframes dust-drift{
    0%{transform:translate(0,0) scale(1);opacity:0;}
    12%{opacity:1;}
    50%{transform:translate(var(--dx,40px),calc(var(--dy,-60px)*0.5)) scale(1.15);}
    88%{opacity:0.7;}
    100%{transform:translate(calc(var(--dx,40px)*2),var(--dy,-60px)) scale(1.3);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .dust-mote{animation:none;display:none;}
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--yellow);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:18px;}
  .hero h1{font-size:clamp(36px,6vw,64px);line-height:1.04;max-width:820px;margin-bottom:22px;}
  .hero h1 em{color:var(--orange);font-style:normal;display:block;}
  .hero p.lead{font-size:18px;color:var(--concrete-2);max-width:560px;margin-bottom:34px;font-weight:400;}
  .hero-ctas{display:flex;gap:16px;flex-wrap:wrap;}
  .stats-strip{max-width:1180px;margin:56px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);position:relative;}
  .stat{padding:20px 8px 0;text-align:center;}
  .stat-num{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--yellow);}
  .stat-label{font-size:12px;color:var(--concrete-2);text-transform:uppercase;letter-spacing:0.04em;margin-top:4px;}
  @media (max-width:700px){.stats-strip{grid-template-columns:repeat(2,1fr);row-gap:20px;}}
  .btn-outline{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--concrete-2);color:var(--concrete);padding:12px 22px;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:0.03em;border-radius:2px;transition:border-color .15s, color .15s;}
  .btn-outline:hover{border-color:var(--yellow);color:var(--yellow);}

  /* SERVICES */
  .services{background:var(--concrete);padding:64px 24px;}
  .services-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--asphalt);border:1px solid var(--asphalt);}
  .service-card{background:var(--concrete);padding:36px 28px;}
  .service-card .num{font-family:'IBM Plex Mono',monospace;color:var(--orange);font-size:13px;letter-spacing:0.06em;margin-bottom:14px;display:block;}
  .service-card h3{font-size:22px;margin-bottom:10px;}
  .service-card p{font-size:14.5px;color:#4a4a44;}

  /* SECTION HEADS */
  .section-head{max-width:1180px;margin:0 auto;padding:70px 24px 10px;}
  .section-head .eyebrow-dark{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--orange-dark);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;}
  .section-head h2{font-size:clamp(28px,4vw,40px);}
  .section-head p.note{color:#666;font-size:14.5px;margin-top:10px;max-width:560px;}

  /* FILTER TABS */
  .filters{max-width:1180px;margin:28px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;}
  .filter-btn{background:transparent;border:1.5px solid var(--asphalt);color:var(--asphalt);padding:8px 16px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;border-radius:2px;transition:.15s;}
  .filter-btn.active, .filter-btn:hover{background:var(--asphalt);color:var(--concrete);}

  /* MACHINE GRID */
  .machine-grid{max-width:1180px;margin:0 auto;padding:34px 24px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .card{background:#fff;border:1px solid #ddd6c6;display:flex;flex-direction:column;transition:transform .18s, box-shadow .18s;}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(28,31,30,0.12);}
  .card-media{aspect-ratio:4/3;background:var(--steel);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
  .card:hover .card-media img{transform:scale(1.08);}
  .card-media .icon{width:64px;height:64px;stroke:var(--concrete-2);opacity:0.85;}
  .badge{position:absolute;top:10px;left:10px;background:var(--yellow);color:var(--asphalt);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:4px 9px;letter-spacing:0.04em;text-transform:uppercase;}
  .badge.example{background:var(--asphalt);color:var(--yellow);left:auto;right:10px;top:10px;}
  .card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{font-size:18px;letter-spacing:0.005em;}
  .card-body .specs{font-size:12.5px;color:#666;line-height:1.6;}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid #eee5d3;}
  .price{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--asphalt);}
  .price small{font-size:11px;color:#888;font-weight:500;}
  .detail-btn{font-size:12.5px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:0.03em;display:flex;align-items:center;gap:5px;}
  .detail-btn:hover{color:var(--orange-dark);}

  /* PROCESS */
  .process{background:var(--concrete-2);padding:70px 24px;}
  .process-grid{max-width:1180px;margin:34px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  .process-step{position:relative;padding-left:6px;}
  .process-step .step-num{font-family:'Oswald',sans-serif;font-size:44px;font-weight:700;color:var(--orange);opacity:0.9;line-height:1;margin-bottom:12px;}
  .process-step h4{font-size:17px;text-transform:uppercase;margin-bottom:8px;letter-spacing:0.02em;}
  .process-step p{font-size:14px;color:#555;}

  /* WHY US */
  .why{background:var(--asphalt);color:var(--concrete);padding:70px 24px;}
  .why-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}
  .why h2{font-size:clamp(26px,4vw,36px);margin-bottom:18px;}
  .why p.lead-p{color:var(--concrete-2);font-size:15px;margin-bottom:22px;max-width:460px;}
  .why-list{display:flex;flex-direction:column;gap:0;}
  .why-item{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);}
  .why-item:first-child{padding-top:0;}
  .why-item .mark{color:var(--orange);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .why-item h4{font-size:16px;margin-bottom:4px;text-transform:none;font-family:'Inter',sans-serif;font-weight:700;}
  .why-item p{font-size:13.5px;color:#a9a49a;margin:0;max-width:100%;}

  /* FAQ */
  .faq{background:var(--concrete);padding:70px 24px;}
  .faq-list{max-width:820px;margin:34px auto 0;}
  .faq-item{border-bottom:1px solid #d8d1bf;}
  .faq-q{width:100%;text-align:left;background:none;border:none;padding:20px 4px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:16px;font-weight:600;color:var(--asphalt);gap:16px;}
  .faq-q .plus{font-family:'IBM Plex Mono',monospace;color:var(--orange);font-size:20px;transition:transform .2s;flex-shrink:0;}
  .faq-item.open .faq-q .plus{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .faq-a p{padding:0 4px 20px;font-size:14.5px;color:#555;max-width:640px;}

  /* TESTIMONIALS */
  .testimonials{background:var(--concrete-2);padding:70px 24px;}
  .testi-grid{max-width:1180px;margin:34px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .testi-card{background:#fff;border:1.5px dashed #c9c2ae;padding:26px 22px;position:relative;}
  .testi-tag{position:absolute;top:-11px;left:20px;background:var(--asphalt);color:var(--yellow);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:3px 10px;letter-spacing:0.05em;text-transform:uppercase;}
  .testi-stars{color:var(--yellow);font-size:15px;letter-spacing:2px;margin-bottom:12px;}
  .testi-text{font-size:14.5px;color:#444;line-height:1.6;margin-bottom:16px;font-style:italic;}
  .testi-author{font-size:13px;font-weight:700;color:var(--asphalt);}
  .testi-role{font-size:12px;color:#888;}
  .testi-note{max-width:1180px;margin:24px auto 0;font-size:13px;color:#777;text-align:center;}
  @media (max-width:860px){.testi-grid{grid-template-columns:1fr;}}

  /* CONTACT / FOOTER */
  .contact{background:var(--concrete);padding:80px 24px 40px;text-align:center;border-top:1px solid #d8d1bf;}
  .contact h2{font-size:clamp(28px,5vw,44px);margin-bottom:16px;}
  .contact p.lead-p{color:#555;max-width:480px;margin:0 auto 30px;font-size:15.5px;}
  .contact .wa-btn{padding:16px 32px;font-size:16px;}
  .contact-info{max-width:1180px;margin:60px auto 0;padding-top:34px;border-top:1px solid #d8d1bf;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:left;}
  .contact-info h4{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:#888;margin-bottom:8px;}
  .contact-info p{margin:0;color:var(--asphalt);font-size:14.5px;}
  footer{background:var(--asphalt);color:#7d7a72;padding:22px 24px;font-size:12.5px;}
  footer strong{color:var(--concrete-2);}
  .footer-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;}
  .footer-links{display:flex;gap:8px;font-size:12.5px;}
  .footer-links a{color:#a9a49a;text-decoration:underline;text-underline-offset:2px;}
  .footer-links a:hover{color:var(--yellow);}
  .legal{background:#161918;padding:36px 24px;border-top:1px solid var(--line);}
  .legal-inner{max-width:820px;margin:0 auto;color:#cfc9bb;}
  .legal-inner h3{color:var(--concrete);font-size:18px;margin-bottom:14px;}
  .legal-inner p{font-size:13.5px;line-height:1.7;margin-bottom:10px;}
  .legal-warning{background:rgba(242,183,5,0.1);border:1px solid rgba(242,183,5,0.35);color:var(--yellow);padding:10px 14px;font-size:12.5px !important;border-radius:2px;}

  @media (max-width:860px){
    nav.links{display:none;}
    .menu-toggle{display:block;}
    .services-grid{grid-template-columns:1fr;}
    .machine-grid{grid-template-columns:1fr 1fr;}
    .process-grid{grid-template-columns:1fr;}
    .why-inner{grid-template-columns:1fr;}
    .contact-info{grid-template-columns:1fr;text-align:center;}
  }
  @media (max-width:560px){
    .machine-grid{grid-template-columns:1fr;}
    .hero{padding:60px 20px 50px;}
    .nav-right{gap:8px;}
  }
</style>

  let currentLang = "de";
  const icon = `<svg class="icon" viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="24" width="18" height="12" rx="1"></rect>
      <path d="M22 24h10l8 8v4H22z"></path>
      <circle cx="12" cy="38" r="4"></circle>
      <circle cx="34" cy="38" r="4"></circle>
    </svg>`;

  function waLink(message){ return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`; }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function applyStaticText(){
    const t = i18n[currentLang];
    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const key = el.getAttribute("data-i18n");
      if(t[key] !== undefined) el.textContent = t[key];
    });
    document.getElementById("wa-nav").href = waLink(t.wa_default);
    document.getElementById("wa-hero").href = waLink(t.wa_default);
    document.getElementById("wa-contact").href = waLink(t.wa_default);
    document.getElementById("wa-float").href = waLink(t.wa_default);
    document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active", b.dataset.lang===currentLang));
  }

  const categories = ["all","baumaschinen","fahrzeuge","werkzeuge","pflege"];
  let activeCategory = "all";
  const grid = document.getElementById("machine-grid");
  const filterBar = document.getElementById("filters");

  function renderFilters(){
    const t = i18n[currentLang];
    filterBar.innerHTML = "";
    const labels = {all:t.cat_all, baumaschinen:t.cat_baumaschinen, fahrzeuge:t.cat_fahrzeuge, werkzeuge:t.cat_werkzeuge, pflege:t.cat_pflege};
    categories.forEach(cat=>{
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (cat===activeCategory ? " active" : "");
      btn.textContent = labels[cat];
      btn.onclick = ()=>{ activeCategory = cat; renderFilters(); renderCards(); };
      filterBar.appendChild(btn);
    });
  }

  function renderCards(){
    const t = i18n[currentLang];
    const typeLabels = {kauf:t.type_kauf, miete:t.type_miete, kauf_miete:t.type_kauf_miete};
    const catLabels = {baumaschinen:t.cat_baumaschinen, fahrzeuge:t.cat_fahrzeuge, werkzeuge:t.cat_werkzeuge, pflege:t.cat_pflege};
    grid.innerHTML = "";
    machines
      .filter(m => activeCategory==="all" || m.category===activeCategory)
      .forEach(m=>{
        const card = document.createElement("div");
        card.className = "card reveal";
        card.innerHTML = `
          <div class="card-media">
            ${m.image ? `<img src="${m.image}" alt="${escapeHtml(m.name)}">` : icon}
            <span class="badge">${typeLabels[m.type]}</span>
            ${m.used ? `<span class="badge example">${t.badge_used}</span>` : ""}
          </div>
          <div class="card-body">
            <h3>${escapeHtml(m.name)}</h3>
            <div class="specs mono">${escapeHtml(m.specs)}</div>
          </div>
          <div class="card-footer">
            <div class="price">${escapeHtml(m.price)}<br><small>${catLabels[m.category]}</small></div>
            <a class="detail-btn" href="${waLink(t.wa_inquiry(m.name))}" target="_blank" rel="noopener noreferrer">${t.detail_btn}</a>
          </div>
        `;
        grid.appendChild(card);
      });
    observeReveals();
  }

  function renderFaq(){
    const t = i18n[currentLang];
    const list = document.getElementById("faq-list");
    list.innerHTML = "";
    for(let i=1;i<=4;i++){
      const item = document.createElement("div");
      item.className = "faq-item";
      item.innerHTML = `
        <button class="faq-q">${t["faq"+i+"_q"]}<span class="plus">+</span></button>
        <div class="faq-a"><p>${t["faq"+i+"_a"]}</p></div>
      `;
      const btn = item.querySelector(".faq-q");
      const ans = item.querySelector(".faq-a");
      btn.onclick = ()=>{
        const isOpen = item.classList.contains("open");
        document.querySelectorAll(".faq-item").forEach(fi=>{fi.classList.remove("open"); fi.querySelector(".faq-a").style.maxHeight = null;});
        if(!isOpen){ item.classList.add("open"); ans.style.maxHeight = ans.scrollHeight + "px"; }
      };
      list.appendChild(item);
    }
  }

  function renderTestimonials(){
    const t = i18n[currentLang];
    const list = document.getElementById("testi-list");
    if(!list) return;
    list.innerHTML = "";
    testimonials.forEach(rev=>{
      const card = document.createElement("div");
      card.className = "testi-card reveal";
      const stars = "★".repeat(rev.stars) + "☆".repeat(5-rev.stars);
      card.innerHTML = `
        ${rev.example ? `<span class="testi-tag">${t.testi_tag}</span>` : ""}
        <div class="testi-stars">${stars}</div>
        <p class="testi-text">${escapeHtml(rev.text)}</p>
        <div class="testi-author">${escapeHtml(rev.author)}</div>
        <div class="testi-role">${escapeHtml(rev.role)}</div>
      `;
      list.appendChild(card);
    });
    const ctaBtn = document.getElementById("testi-cta");
    if(ctaBtn){
      ctaBtn.href = REVIEW_FORM_URL;
      ctaBtn.textContent = t.testi_cta;
    }
    observeReveals();
  }

  function animateCount(el, targetText){
    const match = targetText.match(/^(\d+)(.*)$/);
    if(!match){ el.textContent = targetText; return; }
    const target = parseInt(match[1], 10);
    const suffix = match[2] || "";
    const duration = 900;
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(target * eased);
      el.textContent = current + suffix;
      if(progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function observeStatCounters(){
    const stats = document.querySelectorAll(".stat-num[data-count]");
    if(!stats.length) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          animateCount(e.target, e.target.getAttribute("data-count"));
          io.unobserve(e.target);
        }
      });
    }, {threshold:0.4});
    stats.forEach(el=>io.observe(el));
  }

  function setLang(lang){
    currentLang = lang;
    applyStaticText();
    renderFilters();
    renderCards();
    renderFaq();
    renderTestimonials();
  }

  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> setLang(btn.dataset.lang));
  });

  function observeReveals(){
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in-view"); io.unobserve(e.target); } });
    }, {threshold:0.15});
    document.querySelectorAll(".reveal:not(.in-view)").forEach(el=>io.observe(el));
  }

  setLang("de");
  observeReveals();
  observeStatCounters();

  // TOZ / DUMAN BULUTLARI — sürekli süzülen arka plan tozu
  function spawnDustField(){
    const field = document.getElementById("dust-field");
    if(!field) return;
    const count = 14;
    for(let i=0;i<count;i++){
      const mote = document.createElement("div");
      mote.className = "dust-mote";
      const size = 30 + Math.random()*90;
      const left = Math.random()*100;
      const top = 20 + Math.random()*70;
      const dx = (Math.random()*80 - 20).toFixed(0) + "px";
      const dy = (-(60 + Math.random()*100)).toFixed(0) + "px";
      const duration = 9 + Math.random()*10;
      const delay = Math.random()*duration;
      mote.style.width = size + "px";
      mote.style.height = size + "px";
      mote.style.left = left + "%";
      mote.style.top = top + "%";
      mote.style.setProperty("--dx", dx);
      mote.style.setProperty("--dy", dy);
      mote.style.animationDuration = duration + "s";
      mote.style.animationDelay = "-" + delay + "s";
      field.appendChild(mote);
    }
  }
  spawnDustField();

  // SİNEMATİK PARALAKS — hero içeriği scroll ile hafifçe, yumuşak şekilde hareket eder (derinlik hissi)
  let targetY = 0, currentY = 0;
  function updateParallax(){
    const heroInner = document.querySelector(".hero-inner");
    const stats = document.querySelector(".stats-strip");
    if(!heroInner) return;
    targetY = window.scrollY;
    currentY += (targetY - currentY) * 0.08; // yumuşak takip (lerp)
    const offset = Math.min(currentY * 0.25, 80);
    heroInner.style.transform = `translateY(${offset}px)`;
    if(stats){
      stats.style.transform = `translateY(${offset*0.5}px)`;
    }
    requestAnimationFrame(updateParallax);
  }
  requestAnimationFrame(updateParallax);
</script>
