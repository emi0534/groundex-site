<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroundEx — Stok Takip</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GroundEx Stok">
<link rel="apple-touch-icon" href="../images/icon-192.png">
<style>
  :root{
    --asphalt:#1c1f1e; --asphalt-2:#262b29; --concrete:#edeae3; --concrete-2:#e2ddd0;
    --orange:#e8590c; --orange-dark:#c2480a; --line:#3d4340;
    --ok:#2f9e44; --low:#f2b705; --out:#c92a2a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--concrete);color:var(--asphalt);}
  header{background:var(--asphalt);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;font-weight:700;}
  header small{display:block;font-size:11px;color:#9aa19c;font-weight:400;}
  .btn{background:var(--orange);color:#fff;border:none;padding:9px 14px;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn:hover{background:var(--orange-dark);}
  .btn.ghost{background:transparent;border:1px solid #555;color:#ddd;}
  main{padding:16px;max-width:720px;margin:0 auto;}
  .filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;}
  .filters button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .filters button.active{background:var(--asphalt);color:#fff;border-color:var(--asphalt);}
  .card{background:#fff;border:1px solid var(--concrete-2);border-radius:6px;padding:14px;margin-bottom:10px;display:flex;gap:12px;}
  .card img{width:64px;height:64px;object-fit:cover;border-radius:4px;background:var(--concrete-2);flex-shrink:0;}
  .card-body{flex:1;min-width:0;}
  .card-body h3{margin:0 0 2px;font-size:15px;}
  .card-body .specs{font-size:12.5px;color:#666;margin:0 0 6px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;color:#fff;}
  .badge.stokta{background:var(--ok);}
  .badge.sinirli{background:var(--low);color:#3a2c00;}
  .badge.tukendi{background:var(--out);}
  .row-actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;}
  select.stock-select{padding:6px 8px;border-radius:4px;border:1px solid var(--line);font-size:12.5px;}
  .wa-btn{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;padding:7px 12px;border-radius:4px;font-size:12.5px;font-weight:700;text-decoration:none;}
  #loginModal, #productModal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  #loginModal.open, #productModal.open{display:flex;}
  .modal-box{background:#fff;border-radius:8px;padding:22px;width:100%;max-width:380px;}
  .modal-box h2{margin-top:0;font-size:16px;}
  .modal-box input, .modal-box select{width:100%;padding:9px;margin-bottom:10px;border:1px solid var(--line);border-radius:4px;font-size:14px;}
  .modal-box .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
  .err{color:var(--out);font-size:12.5px;margin-bottom:8px;}
  .empty{text-align:center;color:#888;padding:40px 0;font-size:13.5px;}
  .fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:pointer;display:none;}
  .fab.show{display:block;}
</style>
</head>
<body>

<header>
  <div>
    <h1>GroundEx Stok Takip</h1>
    <small id="modeLabel">Genel görünüm</small>
  </div>
  <button class="btn ghost" id="authBtn">Yönetici Girişi</button>
</header>

<main>
  <div class="filters">
    <button data-cat="all" class="active">Tümü</button>
    <button data-cat="baumaschinen">İş Makineleri</button>
    <button data-cat="fahrzeuge">Araçlar</button>
    <button data-cat="werkzeuge">El Aletleri</button>
  </div>
  <div id="list"></div>
  <div id="emptyMsg" class="empty" style="display:none;">Henüz ürün eklenmedi.</div>
</main>

<button class="fab" id="addFab">+</button>

<!-- Login -->
<div id="loginModal">
  <div class="modal-box">
    <h2>Yönetici Girişi</h2>
    <div class="err" id="loginErr" style="display:none;"></div>
    <input type="email" id="loginEmail" placeholder="E-posta">
    <input type="password" id="loginPass" placeholder="Şifre">
    <div class="row">
      <button class="btn ghost" id="loginCancel">Vazgeç</button>
      <button class="btn" id="loginSubmit">Giriş Yap</button>
    </div>
  </div>
</div>

<!-- Add/Edit product -->
<div id="productModal">
  <div class="modal-box">
    <h2 id="productModalTitle">Ürün Ekle</h2>
    <input type="hidden" id="pId">
    <input type="text" id="pName" placeholder="Ürün adı">
    <select id="pCategory">
      <option value="baumaschinen">İş Makineleri</option>
      <option value="fahrzeuge">Araçlar</option>
      <option value="werkzeuge">El Aletleri</option>
    </select>
    <select id="pType">
      <option value="kauf">Satılık</option>
      <option value="miete">Kiralık</option>
      <option value="kauf_miete">Satılık/Kiralık</option>
    </select>
    <input type="text" id="pPrice" placeholder="Fiyat (örn. 10.000 €)">
    <input type="text" id="pSpecs" placeholder="Teknik bilgi (örn. 2020 model · 500 saat)">
    <input type="text" id="pImage" placeholder="Görsel linki (opsiyonel)">
    <select id="pStock">
      <option value="stokta">Stokta</option>
      <option value="sinirli">Sınırlı</option>
      <option value="tukendi">Tükendi</option>
    </select>
    <div class="row">
      <button class="btn ghost" id="deleteBtn" style="display:none;background:var(--out);color:#fff;border:none;">Sil</button>
      <button class="btn ghost" id="productCancel">Vazgeç</button>
      <button class="btn" id="productSave">Kaydet</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // ===== BURAYI DOLDUR: Firebase Console > Project Settings > SDK setup and configuration =====
  const firebaseConfig = {
    apiKey: "AIzaSyC2YRj8sydObzHXPUb_gJz45qdcFDkh9W8",
    authDomain: "groundex-stok.firebaseapp.com",
    projectId: "groundex-stok",
    storageBucket: "groundex-stok.firebasestorage.app",
    messagingSenderId: "434177544885",
    appId: "1:434177544885:web:d2ee42aa43c3ae2fd7e4fc"
  };
  const WHATSAPP_NUMBER = "491637216123";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const catLabels = { baumaschinen:"İş Makineleri", fahrzeuge:"Araçlar", werkzeuge:"El Aletleri" };
  const stockLabels = { stokta:"Stokta", sinirli:"Sınırlı", tukendi:"Tükendi" };

  let products = [];
  let isAdmin = false;
  let activeCat = "all";

  const listEl = document.getElementById("list");
  const emptyMsg = document.getElementById("emptyMsg");
  const authBtn = document.getElementById("authBtn");
  const modeLabel = document.getElementById("modeLabel");
  const addFab = document.getElementById("addFab");

  onSnapshot(collection(db, "products"), (snap) => {
    products = [];
    snap.forEach(d => products.push({ id: d.id, ...d.data() }));
    products.sort((a,b) => (a.name||"").localeCompare(b.name||""));
    render();
  }, (err) => {
    listEl.innerHTML = `<div class="empty">Veri okunamadı: ${err.message}<br>Firebase ayarlarını ve Firestore kurallarını kontrol et.</div>`;
  });

  onAuthStateChanged(auth, (user) => {
    isAdmin = !!user;
    authBtn.textContent = isAdmin ? "Çıkış Yap" : "Yönetici Girişi";
    modeLabel.textContent = isAdmin ? "Yönetici görünümü" : "Genel görünüm";
    addFab.classList.toggle("show", isAdmin);
    render();
  });

  function render(){
    const filtered = activeCat === "all" ? products : products.filter(p => p.category === activeCat);
    emptyMsg.style.display = filtered.length ? "none" : "block";
    listEl.innerHTML = filtered.map(p => `
      <div class="card">
        ${p.image ? `<img src="${escapeAttr(p.image)}" alt="">` : `<div class="card-img" style="width:64px;height:64px;background:var(--concrete-2);border-radius:4px;flex-shrink:0;"></div>`}
        <div class="card-body">
          <h3>${escapeHtml(p.name||"")}</h3>
          <p class="specs">${escapeHtml(catLabels[p.category]||"")} · ${escapeHtml(p.price||"")}${p.specs ? " · "+escapeHtml(p.specs) : ""}</p>
          ${isAdmin ? `
            <div class="row-actions">
              <select class="stock-select" data-id="${p.id}">
                ${Object.entries(stockLabels).map(([k,v]) => `<option value="${k}" ${p.stock===k?"selected":""}>${v}</option>`).join("")}
              </select>
              <button class="btn ghost editBtn" data-id="${p.id}" style="padding:6px 10px;">Düzenle</button>
            </div>
          ` : `
            <div class="row-actions">
              <span class="badge ${p.stock||'tukendi'}">${stockLabels[p.stock]||"Bilinmiyor"}</span>
              <a class="wa-btn" target="_blank" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Merhaba, "'+ (p.name||'') +'" hakkında bilgi almak istiyorum.')}">WhatsApp</a>
            </div>
          `}
        </div>
      </div>
    `).join("");

    if (isAdmin) {
      listEl.querySelectorAll(".stock-select").forEach(sel => {
        sel.addEventListener("change", async (e) => {
          await setDoc(doc(db,"products",e.target.dataset.id), { stock: e.target.value, updatedAt: serverTimestamp() }, { merge:true });
        });
      });
      listEl.querySelectorAll(".editBtn").forEach(btn => {
        btn.addEventListener("click", () => openProductModal(products.find(p => p.id === btn.dataset.id)));
      });
    }
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCat = btn.dataset.cat;
      render();
    });
  });

  // Auth
  const loginModal = document.getElementById("loginModal");
  authBtn.addEventListener("click", () => {
    if (isAdmin) { signOut(auth); return; }
    document.getElementById("loginErr").style.display = "none";
    loginModal.classList.add("open");
  });
  document.getElementById("loginCancel").addEventListener("click", () => loginModal.classList.remove("open"));
  document.getElementById("loginSubmit").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPass").value;
    const errEl = document.getElementById("loginErr");
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      loginModal.classList.remove("open");
    } catch (e) {
      errEl.textContent = "Giriş başarısız: e-posta veya şifre hatalı.";
      errEl.style.display = "block";
    }
  });

  // Add / edit product
  const productModal = document.getElementById("productModal");
  const fields = ["pId","pName","pCategory","pType","pPrice","pSpecs","pImage","pStock"];
  function openProductModal(p){
    document.getElementById("productModalTitle").textContent = p ? "Ürünü Düzenle" : "Ürün Ekle";
    document.getElementById("pId").value = p ? p.id : "";
    document.getElementById("pName").value = p ? p.name||"" : "";
    document.getElementById("pCategory").value = p ? p.category||"baumaschinen" : "baumaschinen";
    document.getElementById("pType").value = p ? p.type||"kauf" : "kauf";
    document.getElementById("pPrice").value = p ? p.price||"" : "";
    document.getElementById("pSpecs").value = p ? p.specs||"" : "";
    document.getElementById("pImage").value = p ? p.image||"" : "";
    document.getElementById("pStock").value = p ? p.stock||"stokta" : "stokta";
    document.getElementById("deleteBtn").style.display = p ? "inline-block" : "none";
    productModal.classList.add("open");
  }
  addFab.addEventListener("click", () => openProductModal(null));
  document.getElementById("productCancel").addEventListener("click", () => productModal.classList.remove("open"));
  document.getElementById("productSave").addEventListener("click", async () => {
    const id = document.getElementById("pId").value;
    const data = {
      name: document.getElementById("pName").value.trim(),
      category: document.getElementById("pCategory").value,
      type: document.getElementById("pType").value,
      price: document.getElementById("pPrice").value.trim(),
      specs: document.getElementById("pSpecs").value.trim(),
      image: document.getElementById("pImage").value.trim(),
      stock: document.getElementById("pStock").value,
      updatedAt: serverTimestamp()
    };
    if (!data.name) return;
    if (id) await setDoc(doc(db,"products",id), data, { merge:true });
    else await addDoc(collection(db,"products"), data);
    productModal.classList.remove("open");
  });
  document.getElementById("deleteBtn").addEventListener("click", async () => {
    const id = document.getElementById("pId").value;
    if (id && confirm("Bu ürünü silmek istediğine emin misin?")) {
      await deleteDoc(doc(db,"products",id));
      productModal.classList.remove("open");
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
