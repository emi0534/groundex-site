<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Seite nicht gefunden | GroundEx GmbH</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  .notfound{
    min-height:calc(100vh - 90px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:60px 24px;
    background:linear-gradient(180deg,var(--asphalt) 0%, var(--asphalt-2) 100%);
    color:var(--concrete);
  }
  .notfound .digger{
    font-size:64px;
    display:inline-block;
    animation:dig 1.6s ease-in-out infinite;
    margin-bottom:8px;
  }
  @keyframes dig{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-6px) rotate(-4deg);}
    75%{transform:translateY(4px) rotate(4deg);}
  }
  .notfound .code{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(64px,14vw,140px);
    color:var(--orange);line-height:1;margin:8px 0;
  }
  .notfound h2{font-size:clamp(20px,3vw,28px);margin-bottom:12px;}
  .notfound p{color:var(--concrete-2);max-width:460px;margin-bottom:30px;font-size:15px;}
  @media (prefers-reduced-motion: reduce){
    .notfound .digger{animation:none;}
  }
</style>
</head>
<body>
<header>
  <div class="navbar">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="GroundEx GmbH Logo"></a>
  </div>
</header>
<div class="stripe"></div>

<section class="notfound">
  <span class="digger">🚜</span>
  <div class="code">404</div>
  <h2>Diese Fläche wurde noch nicht bearbeitet.</h2>
  <p>Die gesuchte Seite existiert nicht (mehr) — vielleicht wurde sie verschoben, oder die Adresse enthält einen Tippfehler.</p>
  <a href="index.html" class="wa-btn" style="text-decoration:none;">Zur Startseite</a>
</section>

<footer>
  <div class="footer-inner">
    <div><strong>GroundEx GmbH</strong> — Landschaftsbau &amp; Maschinentechnik © 2026</div>
    <div class="footer-links">
      <a href="impressum.html">Impressum</a>
      <span>·</span>
      <a href="datenschutz.html">Datenschutz</a>
      <span>·</span>
      <a href="agb.html">AGB</a>
    </div>
  </div>
</footer>
</body>
</html>
